# Generated from docker-compose.coolify.yml with Docker Compose v5.
# This resolved form avoids Coolify parser limitations around extends and custom YAML tags.
# Regenerate and validate it whenever the pinned hobby release changes.
name: posthog
networks:
  coolify:
    external: true
    name: ${COOLIFY_RESOURCE_UUID}
  default:
    name: posthog_default
services:
  asyncmigrationscheck:
    command: python manage.py run_async_migrations --check
    deploy:
      replicas: 0
    env_file:
      - path: .env.services
        required: true
    environment:
      - 'API_QUERIES_PER_TEAM={"1": 100}'
      - CDP_API_URL=http://plugins:6738
      - DEPLOYMENT=hobby
      - FLAGS_REDIS_ENABLED=false
      - KAFKA_HOSTS=kafka
      - OTEL_SDK_DISABLED=true
      - SKIP_ASYNC_MIGRATIONS_SETUP=0
      - SECRET_KEY=$POSTHOG_SECRET
      - SITE_URL=https://$DOMAIN
    image: $REGISTRY_URL:$POSTHOG_APP_TAG
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: "no"
  capture:
    build:
      args:
        BIN: capture
      context: .
      dockerfile: rust/Dockerfile.coolify
    environment:
      ADDRESS: 0.0.0.0:3000
      CAPTURE_MODE: events
      CAPTURE_V1_SINK_MSK_KAFKA_HOSTS: kafka:9092
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_CLIENT_INGESTION_WARNING: ingestion-clientwarnings-main-1
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_DLQ: events_plugin_ingestion_dlq
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_EXCEPTION: ingestion-errortracking-main
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HEATMAP: heatmaps_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HISTORICAL: events_plugin_ingestion_historical
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_MAIN: events_plugin_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_OVERFLOW: events_plugin_ingestion_overflow
      CAPTURE_V1_SINKS: msk
      KAFKA_HOSTS: kafka:9092
      KAFKA_TOPIC: events_plugin_ingestion
      REDIS_URL: redis://redis7:6379/
      RUST_LOG: info,rdkafka=warn
    image: ghcr.io/posthog/posthog/capture:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  clickhouse:
    depends_on:
      kafka:
        condition: service_started
        required: true
      zookeeper:
        condition: service_started
        required: true
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      KAFKA_HOSTS: kafka:9092
    healthcheck:
      interval: 3s
      retries: 10
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      timeout: 10s
    image: ${CLICKHOUSE_SERVER_IMAGE:-clickhouse/clickhouse-server:26.3.10.60}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - bind:
          create_host_path: true
        source: ./posthog/idl
        target: /idl
        type: bind
      - bind:
          create_host_path: true
        source: ./docker/clickhouse/docker-entrypoint-initdb.d
        target: /docker-entrypoint-initdb.d
        type: bind
      - bind:
          create_host_path: true
        source: ./docker/clickhouse/config.xml
        target: /etc/clickhouse-server/config.xml
        type: bind
      - bind:
          create_host_path: true
        source: ./docker/clickhouse/config.d/default.xml
        target: /etc/clickhouse-server/config.d/default.xml
        type: bind
      - bind:
          create_host_path: true
        source: ./docker/clickhouse/users.xml
        target: /etc/clickhouse-server/users.xml
        type: bind
      - bind:
          create_host_path: true
        source: ./docker/clickhouse/user_defined_function.xml
        target: /etc/clickhouse-server/user_defined_function.xml
        type: bind
      - bind:
          create_host_path: true
        source: ./posthog/user_scripts
        target: /var/lib/clickhouse/user_scripts
        type: bind
      - source: clickhouse-data
        target: /var/lib/clickhouse
        type: volume
        volume: {}
  cyclotron-janitor:
    build:
      args:
        BIN: cyclotron-janitor
      context: .
      dockerfile: rust/Dockerfile.coolify
    depends_on:
      db:
        condition: service_healthy
        required: true
      kafka:
        condition: service_started
        required: true
    environment:
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - KAFKA_HOSTS=kafka:9092
      - KAFKA_TOPIC=clickhouse_app_metrics2
    image: ghcr.io/posthog/posthog/cyclotron-janitor:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  cymbal:
    build:
      args:
        BIN: cymbal
      context: .
      dockerfile: rust/Dockerfile.coolify
    depends_on:
      db:
        condition: service_healthy
        required: true
      geoip-init:
        condition: service_completed_successfully
        required: true
      kafka-init:
        condition: service_completed_successfully
        required: true
      redis7:
        condition: service_healthy
        required: true
      seaweedfs:
        condition: service_healthy
        required: true
    environment:
      BIND_HOST: 0.0.0.0
      BIND_PORT: "3302"
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      ISSUE_BUCKETS_REDIS_URL: redis://redis7:6379/
      KAFKA_HOSTS: kafka:9092
      MAXMIND_DB_PATH: /share/GeoLite2-City.mmdb
      OBJECT_STORAGE_ACCESS_KEY_ID: any
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: any
      PERSONS_URL: postgres://posthog:posthog@db:5432/posthog
      REDIS_URL: redis://redis7:6379/
      RUST_LOG: info
    image: ghcr.io/posthog/posthog/cymbal:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - source: posthog-share
        target: /share
        type: volume
        volume: {}
  db:
    environment:
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_USER: posthog
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 10s
      test:
        - CMD-SHELL
        - pg_isready -U posthog
      timeout: 30s
    image: ${DOCKER_REGISTRY_PREFIX:-}postgres:15.12-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - bind:
          create_host_path: true
        source: docker/postgres-init-scripts
        target: /docker-entrypoint-initdb.d
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: products
        target: /products
        type: bind
      - source: postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  elasticsearch:
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    expose:
      - 9200
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 60s
      test:
        - CMD-SHELL
        - curl -s http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""
      timeout: 10s
    image: elasticsearch:7.17.28
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    volumes:
      - target: /var/lib/elasticsearch/data
        type: volume
        volume: {}
  feature-flags:
    build:
      args:
        BIN: feature-flags
      context: .
      dockerfile: rust/Dockerfile.coolify
    depends_on:
      db:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      ADDRESS: 0.0.0.0:3001
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: 6379
      MAXMIND_DB_PATH: /share/GeoLite2-City.mmdb
      PERSONS_READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      REDIS_URL: redis://redis7:6379/
      RUST_LOG: info
      WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3001/_readiness
      timeout: 5s
    image: ghcr.io/posthog/posthog/feature-flags:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - bind:
          create_host_path: true
        source: share
        target: /share
        type: bind
  geoip-init:
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /share/GeoLite2-City.mmdb ]; then
            apk add --no-cache brotli ca-certificates curl
            curl --fail --location --retry 5 --http1.1 https://mmdbcdn.posthog.net/ \
                | brotli --decompress > /share/GeoLite2-City.mmdb
            chmod 0644 /share/GeoLite2-City.mmdb
        fi
    image: alpine:3.22
    networks:
      default: null
    restart: "no"
    volumes:
      - source: posthog-share
        target: /share
        type: volume
        volume: {}
  hypercache-server:
    build:
      args:
        BIN: hypercache-server
      context: .
      dockerfile: rust/Dockerfile.coolify
    depends_on:
      redis7:
        condition: service_started
        required: true
    environment:
      ADDRESS: 0.0.0.0:3002
      REDIS_URL: redis://redis7:6379/
      RUST_LOG: info
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3002/_readiness
      timeout: 5s
    image: ghcr.io/posthog/posthog/hypercache-server:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  ingestion-error-tracking:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - CDP_REDIS_HOST=redis7
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - KAFKA_HOSTS=kafka:9092
      - PLUGIN_SERVER_MODE=ingestion-errortracking
      - REDIS_URL=redis://redis7:6379/
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  ingestion-general:
    command: node nodejs/dist/index.js
    depends_on:
      clickhouse:
        condition: service_started
        required: true
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - BEHAVIORAL_COHORTS_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - CDP_REDIS_HOST=redis7
      - CLICKHOUSE_DATABASE=posthog
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_VERIFY=false
      - COOKIELESS_REDIS_HOST=redis7
      - COOKIELESS_REDIS_PORT=6379
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - KAFKA_HOSTS=kafka:9092
      - PERSONS_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - PLUGIN_SERVER_MODE=ingestion-v2-combined
      - REDIS_URL=redis://redis7:6379/
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  ingestion-logs:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      KAFKA_HOSTS: kafka:9092
      LOGS_REDIS_HOST: redis7
      PLUGIN_SERVER_MODE: ingestion-logs
      REDIS_URL: redis://redis7:6379/
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  ingestion-sessionreplay:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
      seaweedfs:
        condition: service_started
        required: true
    environment:
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - KAFKA_HOSTS=kafka:9092
      - PLUGIN_SERVER_MODE=recordings-blob-ingestion-v2
      - REDIS_URL=redis://redis7:6379/
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - SESSION_RECORDING_V2_S3_ACCESS_KEY_ID=any
      - SESSION_RECORDING_V2_S3_ENDPOINT=http://seaweedfs:8333
      - SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY=any
      - SESSION_RECORDING_V2_S3_TIMEOUT_MS=120000
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  ingestion-traces:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      KAFKA_HOSTS: kafka:9092
      PLUGIN_SERVER_MODE: ingestion-traces
      REDIS_URL: redis://redis7:6379/
      TRACES_REDIS_HOST: redis7
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  kafka:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 2
      - --memory 3G
      - --reserve-memory 500M
      - --overprovisioned
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds kafka:33145
      - --set redpanda.auto_create_topics_enabled=true
    depends_on:
      zookeeper:
        condition: service_started
        required: true
    environment:
      - ALLOW_PLAINTEXT_LISTENER=true
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
      - KAFKA_LOG_RETENTION_HOURS=1
      - KAFKA_LOG_RETENTION_MS=3600000
    healthcheck:
      interval: 3s
      retries: 10
      test: curl -f http://localhost:9644/v1/status/ready || exit 1
      timeout: 10s
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - source: redpanda-data
        target: /var/lib/redpanda/data
        type: volume
        volume: {}
      - source: kafka-data
        target: /bitnami/kafka
        type: volume
        volume: {}
  kafka-init:
    command:
      - -c
      - |
        set -x
        echo "Waiting for Kafka broker to accept connections..."
        TIMEOUT=60
        ELAPSED=0
        # Use rpk topic list as the readiness check - it's a simple operation
        # that confirms the broker is accepting Kafka protocol requests
        until rpk topic list --brokers kafka:9092 2>/dev/null; do
            echo "Kafka broker not ready yet (elapsed: $${ELAPSED}s)..."
            sleep 2
            ELAPSED=$$((ELAPSED + 2))
            if [ $$ELAPSED -ge $$TIMEOUT ]; then
                echo "Timeout waiting for Kafka broker after $${TIMEOUT}s"
                echo "Final attempt to list topics:"
                rpk topic list --brokers kafka:9092 || true
                exit 1
            fi
        done
        echo "Kafka broker is accepting requests, creating topics..."
        # Create topics needed by rust services and the combined analytics ingestion
        # consumer, which checks topic existence at startup for every output it produces
        # to (see analytics/outputs/registry.ts). Auto-create only fires on producer-first
        # writes, so pre-create them here.
        # Note: $$ escapes $ for docker-compose variable substitution
        TOPICS="clickhouse_events_json \
            clickhouse_ai_events_json \
            clickhouse_heatmap_events \
            clickhouse_ingestion_warnings \
            events_plugin_ingestion_dlq \
            events_plugin_ingestion_overflow \
            events_plugin_ingestion_async \
            ingestion-clientwarnings-main-1 \
            clickhouse_groups \
            clickhouse_person \
            clickhouse_person_distinct_id \
            clickhouse_app_metrics2 \
            log_entries \
            clickhouse_tophog"
        for topic in $$TOPICS; do
            if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                echo "Topic $$topic created successfully"
            else
                if rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                    echo "Topic $$topic already exists, continuing"
                else
                    echo "Failed to create topic $$topic"
                    exit 1
                fi
            fi
        done
        echo "Final topic list:"
        rpk topic list --brokers kafka:9092
        echo "Topics ready"
    depends_on:
      kafka:
        condition: service_healthy
        required: true
    entrypoint: /bin/sh
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
  livestream:
    depends_on:
      kafka:
        condition: service_started
        required: true
    environment:
      - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
    image: ghcr.io/posthog/posthog/livestream:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - bind:
          create_host_path: true
        source: ./docker/livestream/configs-hobby.yml
        target: /configs/configs.yml
        type: bind
  objectstorage:
    command: -c 'mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address ":19000" --console-address ":19001" /data'
    entrypoint: sh
    environment:
      MINIO_ROOT_PASSWORD: object_storage_root_password
      MINIO_ROOT_USER: object_storage_root_user
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - source: objectstorage
        target: /data
        type: volume
        volume: {}
  personhog-replica:
    build:
      args:
        BIN: personhog-replica
      context: .
      dockerfile: rust/Dockerfile.coolify
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      - GRPC_ADDRESS=0.0.0.0:50051
      - METRICS_PORT=9100
      - PRIMARY_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - RUST_LOG=info
    image: ghcr.io/posthog/posthog/personhog-replica:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  personhog-router:
    build:
      args:
        BIN: personhog-router
      context: .
      dockerfile: rust/Dockerfile.coolify
    depends_on:
      personhog-replica:
        condition: service_started
        required: true
    environment:
      BACKEND_TIMEOUT_MS: "5000"
      GRPC_ADDRESS: 0.0.0.0:50052
      METRICS_PORT: "9101"
      REPLICA_URL: http://personhog-replica:50051
      RUST_LOG: info
    image: ghcr.io/posthog/posthog/personhog-router:master
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
  plugins:
    command: node nodejs/dist/index.js
    depends_on:
      clickhouse:
        condition: service_started
        required: true
      db:
        condition: service_started
        required: true
      geoip-init:
        condition: service_completed_successfully
        required: true
      kafka:
        condition: service_started
        required: true
      objectstorage:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
      seaweedfs:
        condition: service_started
        required: true
    environment:

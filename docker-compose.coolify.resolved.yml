  proxy:
    command: -c 'set -x && echo "$$CADDYFILE" > /etc/caddy/Caddyfile && echo "$$CADDY_EXTRA_CONFIG" >> /etc/caddy/Caddyfile && exec caddy run -c /etc/caddy/Caddyfile'
    depends_on:
      livestream:
        condition: service_started
        required: true
      web:
        condition: service_started
        required: true
    entrypoint: sh
    environment:
      - |
        CADDYFILE={
        ${CADDY_TLS_BLOCK:-}
        }
        ${CADDY_HOST:-http://localhost:8000} {
            @replay-capture {
                path /s
                path /s/
                path /s/*
            }

            @capture-ai {
                path /i/v0/ai
                path /i/v0/ai/
                path /i/v0/ai/*
            }

            @capture {
                path /e
                path /e/
                path /e/*
                path /i/v0
                path /i/v0/
                path /i/v0/*
                path /i/v1/analytics/events
                path /i/v1/analytics/events/
                path /batch
                path /batch/
                path /batch/*
                path /capture
                path /capture/
                path /capture/*
            }

            @capture-logs {
                path /i/v1/logs
                path /i/v1/logs/
                path /i/v1/logs/*
                path /i/v1/traces
                path /i/v1/traces/
                path /i/v1/traces/*
                path /i/v1/metrics
                path /i/v1/metrics/
                path /i/v1/metrics/*
            }

            @flags {
                path /flags
                path /flags/
                path /flags/*
                # Local evaluation (flag definitions) — mirrors cloud Contour routing to Rust
                path /api/feature_flag/local_evaluation
                path /api/feature_flag/local_evaluation/
                path /api/feature_flag/local_evaluation/*
            }

            @surveys {
                path /surveys
                path /surveys/
                path /api/surveys
                path /api/surveys/
            }

            @remote-config {
                path /array/*
            }

            @webhooks {
                path /public/webhooks
                path /public/webhooks/
                path /public/webhooks/*
                path /public/m/
                path /public/m/*
            }

            @livestream {
                path /livestream
                path /livestream/
                path /livestream/*
            }

            handle @livestream {
                uri strip_prefix /livestream
                reverse_proxy livestream:8080 {
                    flush_interval -1
                }
            }

            handle @capture-ai {
                reverse_proxy capture-ai:3000
            }

            handle @capture {
                reverse_proxy capture:3000
            }

            handle @replay-capture {
                reverse_proxy replay-capture:3000
            }

            handle @capture-logs {
                reverse_proxy capture-logs:4318
            }

            handle @flags {
                reverse_proxy feature-flags:3001
            }

            handle @surveys {
                reverse_proxy hypercache-server:3002
            }

            handle @remote-config {
                reverse_proxy hypercache-server:3002
            }

            handle @webhooks {
                reverse_proxy plugins:6738
            }

            @objectstorage {
                path /posthog
                path /posthog/
                path /posthog/*
            }

            handle @objectstorage {
                reverse_proxy objectstorage:19000
            }

            handle {
                reverse_proxy web:8000
            }
        }
      - CADDY_EXTRA_CONFIG=
      - CADDY_HOST=:80
      - CADDY_TLS_BLOCK=
      - SERVICE_URL_POSTHOG_80
    image: caddy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COOLIFY_RESOURCE_UUID}
      - traefik.http.middlewares.posthog-gzip.compress=true
      - traefik.http.middlewares.posthog-https.redirectscheme.scheme=https
      - traefik.http.routers.posthog-http.entryPoints=http
      - traefik.http.routers.posthog-http.middlewares=posthog-https
      - traefik.http.routers.posthog-http.rule=Host(`analytics.itagenten.no`) && PathPrefix(`/`)
      - traefik.http.routers.posthog-http.service=posthog-http
      - traefik.http.routers.posthog-https.entryPoints=https
      - traefik.http.routers.posthog-https.middlewares=posthog-gzip
      - traefik.http.routers.posthog-https.rule=Host(`analytics.itagenten.no`) && PathPrefix(`/`)
      - traefik.http.routers.posthog-https.service=posthog-https
      - traefik.http.routers.posthog-https.tls=true
      - traefik.http.routers.posthog-https.tls.certresolver=letsencrypt
      - traefik.http.services.posthog-http.loadbalancer.server.port=80
